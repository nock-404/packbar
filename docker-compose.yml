services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: packbar
      POSTGRES_PASSWORD: packbar
      POSTGRES_DB: packbar
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packbar -d packbar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
